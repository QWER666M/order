name: CI

# 什么时候触发：
#   push 到 main 分支时
#   以及任何 Pull Request（这样别人提 PR 时会先自动验证）
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ==========================================================
  # 任务 1：快速反馈（H2 内存库）
  #
  # 内存库启动快、零外部依赖，最适合"每次 push 都跑一遍"。
  # 但它毕竟是"仿真"数据库，与 MySQL 有差异
  # （字符集、严格模式、自增、外键、VARCHAR 超长行为……），
  # 所以还需要下面那个真数据库任务兜底。
  # ==========================================================
  build:
    name: 构建与测试（H2）
    runs-on: ubuntu-latest

    steps:
      # 1. 把仓库代码拉到 CI 机器上
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 JDK 21（与 pom.xml 里的 java.version 保持一致）
      #    cache: maven 会缓存本地仓库，后续构建快很多
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. 构建 + 跑全部测试
      #    clean  ：清掉上次的产物，做全新构建
      #    verify ：编译 -> 测试 -> 打包，并校验打包结果
      #    -B     ：批处理模式，日志更干净（适合 CI）
      - name: 构建并运行测试
        run: mvn -B clean verify

      # 失败时把测试报告存下来，方便在网页上直观看是哪个用例挂了
      # （CI 控制台日志太长，翻起来很痛苦）
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-h2
          path: target/surefire-reports/
          retention-days: 7

  # ==========================================================
  # 任务 2：真数据库验证（MySQL 8.4）
  #
  # services: 让 GitHub 在 CI 机器上额外起一个【容器】，
  # 效果等价于本地 `docker compose up -d`，但不需要写 Dockerfile。
  #
  # ★ 关键点：这里没有改动任何一行 Java 代码或配置文件。
  #   Spring Boot 的配置优先级是：
  #       命令行参数  >  环境变量  >  application.properties
  #   而环境变量走"宽松绑定"（relaxed binding）：
  #       SPRING_DATASOURCE_URL  ==>  spring.datasource.url
  #   所以只要在 env: 里注入变量，就会覆盖
  #   src/test/resources/application.properties 中的 H2 配置。
  #   这就是"配置外置"（12-Factor App）的实际用法。
  # ==========================================================
  test-mysql:
    name: 集成测试（MySQL 8.4）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orderdb
          MYSQL_USER: order
          MYSQL_PASSWORD: order123
        ports:
          - 3306:3306
        # 健康检查：容器"已启动"不等于数据库"可连接"
        # （mysqld 初始化数据目录还要好几秒）。
        # 配了 health-cmd 后，GitHub 会等它变成 healthy 才开始跑后续步骤。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # 覆盖测试配置里的 H2 连接信息（URL 参数与主配置 application.properties 一致）
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/orderdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order123
      # 给 DataSourceBindingTest 用：断言"真的连上了 MySQL"，
      # 防止环境变量拼错、Spring 静默忽略、测试退回 H2 却显示全绿（流水线说谎）
      EXPECT_DB: mysql

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 双保险：healthcheck 通过后再确认 3306 端口真的能连
      - name: 等待 MySQL 端口可用
        run: |
          echo "目标连接串: $SPRING_DATASOURCE_URL"
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              echo "MySQL 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 在 30 次探测后仍不可用"
          exit 1

      - name: 构建并运行测试（真 MySQL）
        run: mvn -B clean verify

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-mysql
          path: target/surefire-reports/
          retention-days: 7

  # ==========================================================
  # 任务 3：验证 Dockerfile 真的能构建、镜像真的能跑起来
  #
  # ★ 为什么 CI 里要单独验证镜像？
  #   Dockerfile 写错（基础镜像 tag 不存在、COPY 路径不对、
  #   非 root 用户对文件没权限…）在本地很难每次都测到。
  #   放到 CI 里，每次 push 都真实执行一遍 docker build + docker run，
  #   保证"能跑"这件事不是靠记忆，而是被持续验证的。
  #
  # 这一节也顺便验证了容器化最关键的两个假设：
  #   1) 镜像里打进了可运行的 fat jar（多阶段构建的第二阶段复制正确）
  #   2) 应用能通过【环境变量】连上容器网络里的 MySQL（配置外置生效）
  # ==========================================================
  docker-image:
    name: 构建镜像并启动验证
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orderdb
          MYSQL_USER: order
          MYSQL_PASSWORD: order123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 这里【不装 JDK】：构建发生在镜像内部的多阶段构建里，
      # 正好验证"Dockerfile 自带构建环境"这个前提。
      - name: 构建镜像
        run: docker build -t order-app:ci .

      - name: 查看镜像大小
        run: docker image ls order-app:ci --format "镜像大小 {{.Size}}"

      # --network host：让容器直接用宿主机的网络栈，
      # 这样容器里的 127.0.0.1:3306 就是上面那个 MySQL service。
      # （生产环境不会这么用，这里只是为了让 CI 少写一层网络配置。）
      - name: 启动容器
        run: |
          docker run -d --name app --network host \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://127.0.0.1:3306/orderdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true" \
            -e SPRING_DATASOURCE_USERNAME=order \
            -e SPRING_DATASOURCE_PASSWORD=order123 \
            -e JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" \
            order-app:ci

      - name: 等待应用就绪并验证
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/orders || true)
            if [ "$code" = "401" ]; then
              echo "应用已就绪：GET /orders 返回 401（未带 token，符合预期）"
              exit 0
            fi
            sleep 2
          done
          echo "应用在 120 秒内未就绪，最后状态码：$code"
          exit 1

      - name: 输出容器日志（失败时）
        if: failure()
        run: docker logs app

      - name: 确认为非 root 用户运行
        run: |
          whoami_in_container=$(docker exec app id -un)
          echo "容器内运行用户: $whoami_in_container"
          test "$whoami_in_container" = "appuser"
