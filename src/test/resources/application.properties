# ============================================================
# 测试专用配置
#
# ★ 为什么这里能"屏蔽"掉 src/main/resources/application.properties？
#   Maven 会把 src/test/resources 复制到 target/test-classes，
#   而测试时 target/test-classes 在 classpath 上【排在 target/classes 之前】。
#   Spring Boot 按名字找 application.properties 时，取到的第一个就是测试这份，
#   所以主配置里的 MySQL 连接信息在测试中根本不会被加载。
#
# 好处：跑测试不需要 MySQL、不需要 Docker，几秒钟跑完，
#       而且用内存库不会污染任何真实数据。
# ============================================================

# 内存模式：库活在内存里，进程结束即消失
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 内存库每次都是空的，所以必须执行建表脚本
spring.sql.init.mode=always

# ============================================================
# 测试期间关闭鉴权拦截器
#   原因：既有的大量接口测试只关心业务行为，不想每个请求都带 token。
#   鉴权本身由专门的 AuthApiTest（用 @SpringBootTest(properties=...) 打开）覆盖。
# ============================================================
app.auth.enabled=false

# ★ JWT 配置也必须在这里重复一份！
#   因为 src/test/resources/application.properties 与主配置【同名】，
#   它会把主配置【整份遮蔽】掉（不是合并）。所以主配置里的 app.jwt.* 在测试中读不到。
app.jwt.secret=test-only-secret-key-0123456789-0123456789
app.jwt.expire-minutes=120
