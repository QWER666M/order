# ============================================================
# h2 profile：不依赖 MySQL / Docker，用本地 H2 文件数据库运行
#
# 用法：
#     mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# 它只覆盖数据源相关的配置；application.properties 里的公共配置仍然生效。
# 配置的优先级：profile 专属文件 > 公共文件（同名 key 以 profile 为准）。
# ============================================================

# H2 的"文件模式"：数据存在项目目录下的 data\orderdb.mv.db 里，重启不丢
spring.datasource.url=jdbc:h2:file:./data/orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 去掉 MySQL 的连接池额外设置，用默认值即可
spring.datasource.hikari.pool-name=H2Pool

# 打开 H2 自带的数据库控制台，浏览器访问 /h2-console 可直接查看表数据
spring.h2.console.enabled=true
