# ===== 数据库配置 =====
# H2 的"文件模式"：数据存在项目目录下的 data\orderdb.mv.db 文件里，重启服务也不会丢
spring.datasource.url=jdbc:h2:file:./data/orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 每次启动都执行 schema.sql 建表（脚本里用 IF NOT EXISTS，所以重复执行也安全）
spring.sql.init.mode=always

# 打开 H2 自带的数据库控制台，浏览器访问 /h2-console 就能直接看表里的数据
spring.h2.console.enabled=true

# ===== 日志 =====
# 排查 SQL 问题时，把下面这行取消注释，就能在控制台看到每条执行的 SQL 和参数
#logging.level.org.springframework.jdbc.core=DEBUG
