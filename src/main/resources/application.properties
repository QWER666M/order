# ============================================================
# 公共配置（所有环境共用）
# ============================================================
spring.application.name=order-app

# ============================================================
# 数据源：默认使用 MySQL（真实项目形态）
#
# 启动数据库（容器化，推荐）：
#     docker compose up -d
# 停止容器但保留数据：
#     docker compose stop
#
# 没有 Docker 时，可用 H2 备用配置运行：
#     mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================

# JDBC URL 参数说明：
#   characterEncoding=utf8        —— 传输编码用 UTF-8（中文不乱码）
#   serverTimezone=Asia/Shanghai  —— 时区，不设置驱动可能报时区错误
#   useSSL=false                  —— 本地开发不走 SSL（生产应开启）
#   allowPublicKeyRetrieval=true  —— MySQL 8 默认用 caching_sha2_password 插件，
#                                    非 SSL 连接下需要允许取公钥，否则握手失败
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=order
spring.datasource.password=order123

# --------- 连接池（HikariCP，Spring Boot 自带，无需额外依赖）---------
# 连接池的意义：复用数据库连接。每次请求都新建连接（TCP 握手 + 认证）开销远大于复用。
#
# ★ 注意：.properties 文件【不支持行尾注释】！
#   # 只有出现在【行首】才是注释；写在 = 后面会被当成值的一部分。
#   例如 connection-timeout=30000  # 说明   ->  值会变成 "30000  # 说明"，转换 long 失败、启动崩溃。
#   所以下面每条说明都单独占一行。
#
# maximum-pool-size：池中最多同时保留多少个连接
spring.datasource.hikari.maximum-pool-size=10
# minimum-idle：空闲时至少保留多少个连接
spring.datasource.hikari.minimum-idle=2
# connection-timeout：取连接的最长等待时间（毫秒），超时抛异常
# ★ 从 30000 调到 3000：数据库不可用时，健康检查也要等"取连接超时"才返回，
#   30 秒会让 readiness 探针（Docker/K8s 通常 3~5 秒超时）根本来不及判读。
#   3 秒既能让探针及时拿到 DOWN，又不会让正常请求过早失败。
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.pool-name=OrderHikariPool

# 每次启动都执行 schema.sql 建表（脚本里用 IF NOT EXISTS，所以重复执行也安全）
spring.sql.init.mode=always

# ============================================================
# 认证与 JWT
# ============================================================
# ★ 密钥至少 32 字符（HS256 要求 256 位）。
#   生产环境必须通过环境变量/配置中心注入，绝不能把真实密钥提交到代码库！
#   （本地开发用的占位密钥，仅够跑通流程。）
app.jwt.secret=dev-only-secret-key-change-me-in-production-0123456789
# token 有效期（分钟）
app.jwt.expire-minutes=120
# 是否开启鉴权（测试环境置为 false，见 src/test/resources）
app.auth.enabled=true

# ============================================================
# 日志
# ============================================================
# 想看每条执行的 SQL 与参数时，取消下面这行的注释
#logging.level.org.springframework.jdbc.core=DEBUG
# ============================================================
# 超时订单自动清理
# ============================================================
# cron：「秒 分 时 日 月 周」，0 */10 * * * * = 每 10 分钟的第 0 秒
#        "-" = 完全禁用（测试环境用）
app.order.cleanup-cron=0 */10 * * * *
# 超过多少小时未支付算超时
app.order.expire-hours=24

# ============================================================
# 健康检查（Actuator）
# ============================================================
# 只暴露 health 与 info。★ 绝对不要在这里打开 env / heapdump / beans：
#   /actuator/env      会把所有配置（含数据库密码）原样打出来
#   /actuator/heapdump 能下载整个堆内存，里面有明文业务数据
management.endpoints.web.exposure.include=health,info

# 开启 liveness / readiness 两个探针，供 Docker / K8s 使用：
#   liveness  失败 -> 该重启（进程本身卡死）
#   readiness 失败 -> 该摘流量（依赖不可用，重启也没用）
management.endpoint.health.probes.enabled=true

# ★ 坑：Spring Boot 默认的 readiness 组【只包含 readinessState】（应用自身是否愿意接流量），
#   【不包含 db】。也就是说数据库挂了，readiness 仍然是 UP ——
#   这个默认值和"依赖不可用就摘流量"的预期相反，实测确认过。
#   显式把 db 加进 readiness 组，才能做到"数据库不可用 -> 摘流量"。
#   liveness 则【故意】只保留 livenessState：绝不因为外部依赖挂掉而触发重启。
management.endpoint.health.group.readiness.include=readinessState,db

# 健康详情（如 db 的具体错误）只给已授权者看，避免对外泄露内部结构
management.endpoint.health.show-details=when-authorized
